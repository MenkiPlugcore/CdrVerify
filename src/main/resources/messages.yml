prefix: "&8[&bCdrVerify&8] &r"

kick:
  unverified-v3: |-
    &8&m--------------------------------
    &b&lVEPHILIM ROLEPLAY
    &fAkun belum terverifikasi
    &8&m--------------------------------

    &7Nick Minecraft:
    &b&l%player%

    &7Buka Discord Vephilim:
    &b%invite%

    &7Di channel verifikasi, klik tombol
    &fVerifikasi Akun &7lalu gunakan:
    &f/verify nick:%player%

    &7Pending verifikasi berlaku sekitar
    &f%minutes% menit&7 sejak percobaan join.

    &fSetelah berhasil, masuk kembali ke server.

  ip-reverify-v3: |-
    &8&m--------------------------------
    &e&lSECURITY CHECK
    &fKonfirmasi Discord diperlukan
    &8&m--------------------------------

    &7Perubahan IP terdeteksi untuk:
    &e&l%player%

    &7Buka Discord Vephilim lalu gunakan:
    &f/verify nick:%player%

    &7Gunakan akun Discord yang memang sudah
    &7terhubung dengan akun Minecraft tersebut.
    &7Discord: &b%invite%

  unavailable: |-
    &cSistem verifikasi sedang tidak tersedia.
    &7Silakan hubungi Staff Vephilim.

minecraft:
  admin-prefix: "&8[&bCdrVerify&8] &r"
  reloaded: "&aConfiguration dan messages berhasil di-reload."
  player-not-found: "&cPlayer tidak ditemukan: &f%player%"
  no-pending: "&eTidak ada sesi pending untuk &f%player%&e."
  reset: "&aSesi verifikasi &f%player% &atelah di-reset."
  unlinked: "&aLink Discord untuk &f%player% &atelah dilepas."
  force-success: "&aBerhasil menghubungkan &f%player% &ake Discord ID &f%discord_id%&a."
  force-conflict: "&cTidak dapat force link karena salah satu akun sudah terhubung. Unlink terlebih dahulu."

discord:
  panel-v3: |-
    🔐 **VEPHILIM ACCOUNT VERIFICATION**

    Hubungkan akun Minecraft Java kamu dengan Discord sebelum masuk ke Vephilim Roleplay.

    **Cara verifikasi**
    1. Coba join server Minecraft menggunakan akun yang ingin dihubungkan
    2. Catat nickname Minecraft kamu
    3. Klik tombol **Verifikasi Akun** di bawah
    4. Gunakan `/verify nick:<nickname>`
    5. Setelah sukses, join kembali ke Minecraft

    Verifikasi hanya dapat dilakukan untuk nickname yang memiliki pending join aktif.

  button-help-v3: |-
    🔐 **Verifikasi Akun**

    Pastikan kamu sudah mencoba join Vephilim menggunakan akun Minecraft yang ingin dihubungkan.

    Lalu gunakan:
    `/verify nick:Caderaaa`

    Ganti `Caderaaa` dengan nickname Minecraft kamu sendiri.

  button-cooldown: "⏳ Tunggu **%seconds% detik** sebelum menekan tombol lagi."
  wrong-channel: "❌ Verifikasi hanya dapat digunakan di channel verifikasi Vephilim."
  wrong-guild: "❌ Command ini hanya dapat digunakan di Discord Vephilim."
  slash-disabled: "❌ Slash command verifikasi sedang dinonaktifkan oleh administrator."

  success-v3: |-
    ✅ **VERIFIKASI BERHASIL**

    Discord:
    **%discord%**

    Nick Minecraft:
    **%player%**

    Status:
    **VERIFIED**

    Silakan kembali ke Vephilim Roleplay.

  reverify-success-v3: |-
    ✅ **KONFIRMASI BERHASIL**

    Discord:
    **%discord%**

    Nick Minecraft:
    **%player%**

    Status:
    **VERIFIED**

    IP baru telah dikonfirmasi. Silakan kembali ke Vephilim Roleplay.

  pending-not-found: |-
    ❌ **PENDING TIDAK DITEMUKAN**

    Nick tersebut belum memiliki pending join aktif atau sesinya sudah kedaluwarsa.

    Coba join Vephilim menggunakan nickname Minecraft kamu terlebih dahulu, lalu jalankan `/verify` lagi.

  locked-v3: |-
    ⛔ Terlalu banyak percobaan nickname yang tidak valid.
    Coba lagi dalam **%minutes% menit**.

  discord-already-linked: |-
    ❌ Akun Discord ini sudah terhubung ke akun Minecraft lain.
    Hubungi Staff Vephilim jika ini tidak sesuai.

  minecraft-already-linked: |-
    ❌ Akun Minecraft ini sudah terhubung ke Discord lain.
    Hubungi Staff Vephilim jika ini tidak sesuai.

  wrong-discord-v3: |-
    ❌ Konfirmasi keamanan ini harus dilakukan menggunakan akun Discord yang sudah terhubung dengan nickname Minecraft tersebut.

  internal-error: |-
    ❌ Verifikasi gagal karena kesalahan internal. Hubungi Staff Vephilim.
