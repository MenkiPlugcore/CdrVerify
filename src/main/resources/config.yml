# CdrVerify configuration
# Vephilim Roleplay account verification

verification:
  enabled: true

  code:
    prefix: "VPH-"
    digits: 6
    expire-minutes: 15
    reuse-until-expired: true
    regenerate-on-ip-change: true

  discord:
    # Required. Enable Developer Mode in Discord, then Copy Server ID / Channel ID.
    guild-id: ""
    verification-channel-id: ""
    invite: ""

    # Optional Discord role granted after successful verification.
    verified-role-id: ""

    # Main verification method.
    slash-command:
      enabled: true

    # Keep false for a read-only verification channel.
    # If enabled, users may paste VPH-XXXXXX directly into the channel.
    allow-message-code: false

    # Persistent panel. Run /cdrverify panel once.
    panel:
      button-label: "Verifikasi Akun"
      button-cooldown-seconds: 3

    # Only used when allow-message-code is enabled.
    delete-submitted-code: true
    response-delete-seconds: 15

    # Slash command replies are already ephemeral, so DM is off by default.
    dm-success: false

security:
  ip-binding:
    # OFF     = IP is ignored.
    # SESSION = IP protects only unfinished verification sessions. Recommended.
    # STRICT  = verified accounts must re-confirm from Discord when IP changes.
    mode: "SESSION"

    # Change this before production.
    hash-salt: "CHANGE-ME-CdrVerify"

  brute-force:
    enabled: true
    max-failed-attempts: 5
    lock-minutes: 5

bypass:
  usernames: []
  uuids: []

maintenance:
  checkpoint-interval-seconds: 60

storage:
  pending-file: "pending.yml"
  verified-meta-file: "verified-meta.yml"
  audit-file: "audit.log"
