# CdrVerify configuration
# Vephilim Roleplay account verification

config-version: 3

verification:
  enabled: true

  # Player must have tried to join Minecraft recently before Discord can claim the nickname.
  pending:
    expire-minutes: 15

  discord:
    # Required. Enable Developer Mode in Discord, then Copy Server ID / Channel ID.
    guild-id: ""
    verification-channel-id: ""
    invite: ""

    # Optional Discord role granted after successful verification.
    verified-role-id: ""

    # Native Discord command: /verify nick:<minecraft_nickname>
    slash-command:
      enabled: true

    # Persistent panel. Run /cdrverify panel once; the button keeps working after restarts.
    panel:
      button-label: "Verifikasi Akun"
      button-cooldown-seconds: 3

    # Also DM the player after successful verification.
    dm-success: true

security:
  ip-binding:
    # OFF     = IP is ignored.
    # SESSION = IP only protects an unfinished verification session. Recommended.
    # STRICT  = a verified account must re-confirm from its linked Discord after its IP changes.
    mode: "SESSION"

    # Used when hashing IP addresses before writing them to disk.
    # Change this to a long random value before production.
    hash-salt: "CHANGE-ME-CdrVerify"

  # Wrong/unknown nickname claims are rate-limited per Discord account.
  brute-force:
    enabled: true
    max-failed-attempts: 5
    lock-minutes: 5

bypass:
  usernames: []
  uuids: []

maintenance:
  checkpoint-interval-seconds: 60

storage:
  pending-file: "pending.yml"
  verified-meta-file: "verified-meta.yml"
  audit-file: "audit.log"
