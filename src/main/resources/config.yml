# CdrVerify configuration
# Vephilim Roleplay account verification

verification:
  enabled: true

  code:
    # Empty prefix = numeric-only verification code, example: 2331
    prefix: ""
    digits: 4
    expire-minutes: 15
    reuse-until-expired: true
    regenerate-on-ip-change: true

  discord:
    # Required. Enable Developer Mode in Discord, then Copy Server ID / Channel ID.
    guild-id: ""
    verification-channel-id: ""
    invite: ""

    # Optional Discord role granted after successful verification.
    verified-role-id: ""

    # Direct-code is the primary verification method.
    # Player simply sends the 4 digit code in the verification channel.
    slash-command:
      enabled: false

    # Must be true for direct-code verification.
    allow-message-code: true

    # Persistent panel. Run /cdrverify panel once.
    panel:
      button-label: "Cara Verifikasi"
      button-cooldown-seconds: 3

    # Submitted codes are deleted immediately so they are not exposed in channel history.
    delete-submitted-code: true

    # Bot verification result is temporary. 0 = do not auto-delete.
    response-delete-seconds: 15

    dm-success: false

security:
  ip-binding:
    # OFF     = IP is ignored.
    # SESSION = IP protects only unfinished verification sessions.
    # STRICT  = verified accounts must confirm unknown IPs through their linked Discord.
    mode: "STRICT"

    # Change this before production.
    hash-salt: "CHANGE-ME-CdrVerify"

    # Trusted login protection for STRICT mode.
    trusted:
      enabled: true
      # Maximum remembered IP fingerprints per verified Minecraft account.
      max-entries: 3
      # A trusted IP expires if it has not been used for this many days.
      ttl-days: 30

  brute-force:
    enabled: true
    # Numeric 4-digit codes have a smaller keyspace, so keep failed attempts limited.
    max-failed-attempts: 3
    lock-minutes: 5

bypass:
  usernames: []
  uuids: []

maintenance:
  checkpoint-interval-seconds: 60

storage:
  pending-file: "pending.yml"
  verified-meta-file: "verified-meta.yml"
  audit-file: "audit.log"
