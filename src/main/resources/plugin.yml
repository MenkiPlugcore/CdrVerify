name: CdrVerify
version: ${project.version}
main: id.cadera.cdrverify.CdrVerifyPlugin
api-version: '1.21'
author: Cadera
description: Discord-first account verification for Vephilim Roleplay.
depend: [DiscordSRV]

commands:
  cdrverify:
    description: CdrVerify administration command
    usage: /cdrverify <status|pending|reset|unlink|force|panel|doctor|reload>
    permission: cdrverify.admin

permissions:
  cdrverify.admin:
    description: Allows use of CdrVerify administration commands
    default: op
