name: Build CdrVerify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean verify

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CdrVerify
          path: target/CdrVerify-*.jar
          if-no-files-found: error
